[project]
name = "job-market-etl"
version = "0.1.0"
description = "A tools to get data from Job market and ETL progress"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.3",
    "fastapi[standard]>=0.162.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.3",
    "moto[s3]>=5.2.5",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "DTZ", "PT", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
